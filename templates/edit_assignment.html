{% extends "base.html" %}

{% block title %}Edit Assignment - UMS{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Assignment</h1>
    <p class="text-muted">Modify assignment details</p>
</div>

<div class="form-section">
    <form method="POST" action="{{ url_for('edit_assignment', assignment_id=assignment.id) }}" class="form">
        <div class="form-grid">
            <div class="form-group">
                <label for="subject_id">Subject</label>
                <select id="subject_id" name="subject_id" required>
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if subject.id == assignment.subject_id %}selected{% endif %}>
                        {{ subject.subject_name }} ({{ subject.subject_code }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required value="{{ assignment.title }}">
            </div>

            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" required value="{{ assignment.due_date }}">
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="pending" {% if assignment.status == 'pending' %}selected{% endif %}>Pending</option>
                    <option value="submitted" {% if assignment.status == 'submitted' %}selected{% endif %}>Submitted</option>
                    <option value="completed" {% if assignment.status == 'completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ assignment.description }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <a href="{{ url_for('manage_assignments') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>

<style>
.form-section {
    background: white;
    padding: 1.5rem;
    border-radius: 10px;
    box-shadow: var(--shadow);
}

.form {
    max-width: 800px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
    margin-bottom: 1rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-actions {
        flex-direction: column;
    }
}
</style>
{% endblock %}
